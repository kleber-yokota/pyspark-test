name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests main.py

  unit-and-fuzz:
    name: Unit + Fuzz (sem Docker)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: pytest unit + fuzz com cobertura
        run: >
          uv run pytest tests/unit tests/fuzz -v
          --cov=pyspark_test.rows
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-fuzz
          path: coverage.xml

  mutation:
    name: Mutacao (mutmut)
    needs: unit-and-fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      # Falha o job se qualquer mutante sobreviver (suite de unit tests por mutante)
      - name: mutmut run
        run: uv run mutmut run
      - name: Report HTML
        if: always()
        run: uv run mutmut html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-report
          path: mutmut.html

  integration:
    name: Integracao (Spark em Docker)
    needs: [unit-and-fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Aquecer cache da image
        run: docker pull apache/spark:4.2.0-python3
      - name: pytest integration com cobertura
        run: >
          uv run pytest tests/integration -v
          --cov=pyspark_test.pipeline
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage.xml
