[project]
name = "pyspark-test"
version = "0.1.0"
description = "Pipeline PySpark com camadas de testes: unit, fuzz, mutacao e integracao (Spark em Docker via testcontainers)"
requires-python = ">=3.14"
dependencies = [
    "pyspark[connect]>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers>=4.15.0",
    "hypothesis>=6.0",
    "mutmut>=3.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que sobem o Spark em Docker (requerem acesso ao Docker)",
]

[tool.coverage.run]
source = ["src/pyspark_test"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mutmut]
# Mutacao so na camada pura (sem Spark): e a parte que mais buga e roda mais rapido.
# A suite usada por mutante e a de unit tests (sem Docker).
source_paths = ["src/pyspark_test/rows.py"]
pytest_add_cli_args_test_selection = ["tests/unit"]
pytest_add_cli_args = ["-q", "--no-header"]
