[project]
name = "pyspark-test"
version = "0.1.0"
description = "Transformacao PySpark (capitalize) testada com Spark em Docker via testcontainers"
requires-python = ">=3.14"
dependencies = [
    "pyspark[connect]>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers>=4.15.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/pyspark_test"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
