[project]
name = "pyspark-test"
version = "0.1.0"
description = "PySpark transformations (capitalize) tested with real Spark in Docker via testcontainers"
requires-python = ">=3.14"
dependencies = [
    "pyspark[connect]>=4.2.0",
]

[dependency-groups]
dev = [
    "boto3>=1.43",
    "pytest>=9.1.1",
    "testcontainers>=4.15.0",
    "testcontainers-floci>=0.2.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/pyspark_test"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The ``spark`` session is injected into the spark-pipelines module
# namespace at runtime (the annotation only documents the type).
"pipelines/**/*.py" = ["F821"]
